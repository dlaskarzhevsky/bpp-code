trigger: none

pool:
  vmImage: 'windows-latest'

variables:
- group: sky-soft-application-server-dev
- name: ssas_solution_path
  value: .\SkySoftFrameworkSolutions\SkySoftApplicationServerSolution.sln

steps:
- script: |
    echo build_config:                      $(build_config)
    echo ssas_nuget_feed_name:              $(ssas_nuget_feed_name)
    echo ssas_nuget_package_version:        $(ssas_nuget_package_version)    
  displayName: Display pipeline variables

- task: DotNetCoreCLI@2
  displayName: 'dotnet restore'
  inputs:
    command: 'restore'
    projects: $(ssas_solution_path)

- task: DotNetCoreCLI@2
  displayName: 'dotnet build $(build_config)'
  inputs:
    command: 'build'
    projects: $(ssas_solution_path)
    arguments: '--configuration $(build_config) --no-restore'

- task: DotNetCoreCLI@2
  displayName: 'dotnet pack'
  inputs:
    command: 'pack'
    packagesToPack: $(ssas_solution_path)
    versioningScheme: byEnvVar
    versionEnvVar: SSAS_NUGET_PACKAGE_VERSION
    outputDir: '$(Pipeline.Workspace)\n'
    arguments: '--no-restore --no-build'

- task: DotNetCoreCLI@2
  displayName: 'dotnet push'
  inputs:
    command: 'push'
    searchPatternPush: '$(Pipeline.Workspace)\n\*.nupkg'
    feedPublish: $(ssas_nuget_feed_name)

- script: |
    cd $(Pipeline.Workspace)\n   
    dir
  displayName: "Debug: Show n folder"
