name: publish-nuget-packages

on:
  push:
    branches: [ publish-nuget-packages-github ]

jobs:
  publish-nuget-packages:
    runs-on: ubuntu-latest
    environment: dev

    steps:
    - name: display pipeline variables
      run: |
        echo build_config:                      $(build_config)
        echo nuget_feed_name:                   $(nuget_feed_name)
        echo nuget_package_version:             $(nuget_package_version)
        echo solution_path:                     $(solution_path)
