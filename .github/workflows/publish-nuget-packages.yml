name: publish-nuget-packages

on:
  workflow_dispatch:
  push:
    branches: [ nuget-dev, nuget-prod ]

jobs:
  publish-nuget-packages:
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/nuget-dev' && 'dev' || github.ref == 'refs/heads/nuget-prod' && 'prod' }}

    steps:
    - name: display pipeline variables
      run: |
        echo bpp_code_pat:          ${{ secrets.bpp_code_pat }}
        echo build_config:          ${{ vars.build_config }}
        echo nuget_feed_name:       ${{ vars.nuget_feed_name }}
        echo nuget_package_version: ${{ vars.nuget_package_version }}
        echo solution_path:         ${{ vars.solution_path }}

    - name: checkout repo
      uses: actions/checkout@v4

    - name: setup .net sdk
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '9.0.x'

    - name: dotnet restore
      run: dotnet restore ${{ vars.solution_path }}

    - name: dotnet build
      run: dotnet build --configuration ${{ vars.build_config }} --no-restore ${{ vars.solution_path }}

    - name: dotnet pack
      run: dotnet pack --no-build --no-restore --output /home/runner/work/n -p:PackageVersion=${{ vars.nuget_package_version }} ${{ vars.solution_path }}

    - name: show packages folder
      run: |
        cd /home/runner/work/n
        ls
