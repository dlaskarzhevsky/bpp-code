name: publish-nuget-packages

on:
  workflow_dispatch:
  push:
    branches: [ nuget-dev, nuget-prod ]

jobs:
  publish-nuget-packages:
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/nuget-dev' && 'dev' || github.ref == 'refs/heads/nuget-prod' && 'prod' }}

    steps:
    - name: display pipeline variables
      run: |
        echo bpp_code_pat:          ${{ secrets.bpp_code_pat }}
        echo build_config:          ${{ vars.build_config }}
        echo nuget_feed_name:       ${{ vars.nuget_feed_name }}
        echo nuget_package_version: ${{ vars.nuget_package_version }}
        echo solution_path:         ${{ vars.solution_path }}

    - name: checkout repo
      uses: actions/checkout@v4

    - name: setup .net sdk
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '9.0.x'

    - name: dotnet restore
      run: |
        pwsh -v
        pwd
        ls
        dotnet restore ${{ vars.solution_path }}
