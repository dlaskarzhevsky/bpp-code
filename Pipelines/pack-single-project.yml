trigger: none

pool:
  vmImage: 'windows-latest'

variables:
- group: sky-soft-application-server-dev

steps:
- script: |
    echo build_config:                      $(build_config)
    echo nuget_feed_name:                   $(nuget_feed_name)
    echo nuget_package_version:             $(nuget_package_version)
    echo project_path:                      $(project_path)
  displayName: Display pipeline variables

- task: DotNetCoreCLI@2
  displayName: 'dotnet restore'
  inputs:
    command: 'restore'
    projects: $(project_path)

- task: DotNetCoreCLI@2
  displayName: 'dotnet build $(build_config)'
  inputs:
    command: 'build'
    projects: $(project_path)
    arguments: '--configuration $(build_config) --no-restore'

- task: DotNetCoreCLI@2
  displayName: 'dotnet pack'
  inputs:
    command: 'pack'
    packagesToPack: $(project_path)
    versioningScheme: byEnvVar
    versionEnvVar: NUGET_PACKAGE_VERSION
    outputDir: '$(Pipeline.Workspace)\n'

- script: |
    cd $(Pipeline.Workspace)\n   
    dir
  displayName: "Show n folder"

- task: DotNetCoreCLI@2
  displayName: 'dotnet push'
  inputs:
    command: 'push'
    searchPatternPush: '$(Pipeline.Workspace)\n\*.nupkg'
    feedPublish: $(nuget_feed_name)
